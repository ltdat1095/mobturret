CONFIG_PRINTK=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_ASSERT=y
CONFIG_GPIO=y

CONFIG_CPP=y

# LPUART3 driver (servo comms on GPIO_14/15, see boards/imx93_evk_mimx9352_m33.overlay)
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y

# GPIO for status LEDs (red/green/blue on FRDM-iMX93)
CONFIG_GPIO=y

# Disable UART interrupt-driven mode — baremetal-style polling only.
# With IRQ enabled, the Zephyr driver installs an IRQ handler that
# leaves RX error flags set on the i.MX93 LPUART3, which keeps RDRF
# stuck at 0 and prevents external loopback from succeeding.
CONFIG_UART_INTERRUPT_DRIVEN=n

# === RPMsg / OpenAMP (Phase A: hello-world port) ===
# v10: low-level rpmsg_init_vdev + rpmsg_create_ept (port of the
# upstream imx93 sample main_remote.c). Drops the rpmsg_service
# high-level API which wedged the M33 LPUART2 console — the service
# init took a mutex the printk flush path also needed.
#
# See gun_bot/RPMSG.md for the transport contract; the A55 DTB
# reserved-memory regions are matched in the overlay.

# OpenAMP core + NXP vendor resource table
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_COPY_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8

# MBOX driver + IPM wrapper (re-enabled for v22)
CONFIG_IPM=y
CONFIG_MBOX=y
CONFIG_MBOX_NXP_IMX_MU=y
CONFIG_MBOX_INIT_PRIORITY=50

# We use low-level rpmsg_init_vdev; RPMSG_SERVICE is intentionally
# NOT set so the high-level service backend doesn't wedge printk.

# Bring-up logging — keep CONFIG_LOG off to avoid the Zephyr log
# subsystem binding a backend at boot that wedges printk. We use
# raw printk() (CONFIG_PRINTK=y at top of file) for the
# hello-world diagnostics.
# CONFIG_LOG=y
