CONFIG_PRINTK=y
CONFIG_HEAP_MEM_POOL_SIZE=256
CONFIG_ASSERT=y
CONFIG_GPIO=y

CONFIG_CPP=y

# LPUART3 driver (servo comms on GPIO_14/15, see boards/imx93_evk_mimx9352_m33.overlay)
CONFIG_SERIAL=y
CONFIG_UART_MCUX_LPUART=y

# GPIO for status LEDs (red/green/blue on FRDM-iMX93)
CONFIG_GPIO=y

# Disable UART interrupt-driven mode — baremetal-style polling only.
# With IRQ enabled, the Zephyr driver installs an IRQ handler that
# leaves RX error flags set on the i.MX93 LPUART3, which keeps RDRF
# stuck at 0 and prevents external loopback from succeeding.
CONFIG_UART_INTERRUPT_DRIVEN=n
