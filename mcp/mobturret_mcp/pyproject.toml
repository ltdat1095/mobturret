[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobturret-mcp"
version = "0.1.0"
description = "MCP server exposing MobTurret repo state to Claude Code"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
mobturret-mcp = "mobturret_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mobturret_mcp*"]
